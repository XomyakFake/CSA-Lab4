  Program
    Const BUF
      Num 32
    Array name
      Ident BUF
    Func print_str(s)
      Var i
        Num 0
      While
        Binary !=
          Index
            Ident s
            Ident i
          Char '\0'
        Block
          Call out
            Index
              Ident s
              Ident i
          Assign
            Ident i
            Binary +
              Ident i
              Num 1
    Func read_line(buf)
      Var i
        Num 0
      Var c
        Call in
      While
        Binary !=
          Ident c
          Char '\n'
        Block
          If
            Binary >=
              Ident i
              Binary -
                Ident BUF
                Num 1
            Block
              Return
                Unary -
                  Num 1
          Assign
            Index
              Ident buf
              Ident i
            Ident c
          Assign
            Ident i
            Binary +
              Ident i
              Num 1
          Assign
            Ident c
            Call in
      Assign
        Index
          Ident buf
          Ident i
        Char '\0'
      Return
        Ident i
    Call print_str
      Str "What is your name?\n"
    If
      Binary ==
        Call read_line
          Ident name
        Unary -
          Num 1
      Block
        Call print_str
          Str "name too long\n"
      Block
        Call print_str
          Str "Hello, "
        Call print_str
          Ident name
        Call print_str
          Str "!\n"
