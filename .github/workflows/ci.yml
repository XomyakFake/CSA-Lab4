name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: gofumpt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          go install mvdan.cc/gofumpt@v0.7.0
          unformatted="$(gofumpt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Files are not formatted with gofumpt:"
            echo "$unformatted"
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6

  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test (unit and golden tests)
        run: go test -v ./...
