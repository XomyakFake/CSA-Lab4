  Program
    Func print_int(n)
      If
        Binary <
          Ident n
          Num 0
        Block
          Call out
            Char '-'
          Assign
            Ident n
            Unary -
              Ident n
      If
        Binary >=
          Ident n
          Num 10
        Block
          Call print_int
            Binary /
              Ident n
              Num 10
      Call out
        Binary +
          Char '0'
          Binary %
            Ident n
            Num 10
    Func factorial(n)
      If
        Binary <=
          Ident n
          Num 1
        Block
          Return
            Num 1
      Return
        Binary *
          Ident n
          Call factorial
            Binary -
              Ident n
              Num 1
    Func fib(n)
      If
        Binary <
          Ident n
          Num 2
        Block
          Return
            Ident n
      Return
        Binary +
          Call fib
            Binary -
              Ident n
              Num 1
          Call fib
            Binary -
              Ident n
              Num 2
    Func gcd(a, b)
      If
        Binary ==
          Ident b
          Num 0
        Block
          Return
            Ident a
      Return
        Call gcd
          Ident b
          Binary %
            Ident a
            Ident b
    Func max3(a, b, c)
      Var m
        Ident a
      If
        Binary >
          Ident b
          Ident m
        Block
          Assign
            Ident m
            Ident b
      If
        Binary >
          Ident c
          Ident m
        Block
          Assign
            Ident m
            Ident c
      Return
        Ident m
    Call print_int
      Call factorial
        Num 6
    Call out
      Char ' '
    Call print_int
      Call fib
        Num 10
    Call out
      Char ' '
    Call print_int
      Call gcd
        Num 84
        Num 36
    Call out
      Char ' '
    Call print_int
      Call max3
        Num 7
        Call factorial
          Num 4
        Call fib
          Num 8
    Call out
      Char '\n'
